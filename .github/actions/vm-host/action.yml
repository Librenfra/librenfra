# GitHub'ın Ubuntu runner'ını QEMU testleri için hazırlar: KVM, qemu, genisoimage ve geniş disk.
# İmajlar ve diskler kök dosya sisteminin boş alanına sığmaz; /mnt kullanılır.
name: vm-host
description: QEMU ile rol ve firewall testleri için runner hazırlığı
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        sudo apt-get update -q
        sudo apt-get install -y -q --no-install-recommends qemu-system-x86 qemu-utils genisoimage
        sudo mkdir -p /mnt/containers /mnt/vm-test
        # İndirmeler ve diskler runner kullanıcısıyla da /mnt'ye yazılır.
        sudo chown "$(id -u):$(id -g)" /mnt /mnt/vm-test
        sudo mount --bind /mnt/containers /var/lib/containers
        ls -l /dev/kvm
        # KVM'in çalıştığını gösterir: diski olmayan bir makine 5 saniyede SeaBIOS'u açmalı.
        sudo timeout 5 qemu-system-x86_64 -accel kvm -cpu host -m 256 -display none -nodefaults \
            -chardev file,id=bios,path=/tmp/kvm-smoke.log -device isa-debugcon,iobase=0x402,chardev=bios || true
        grep -m1 SeaBIOS /tmp/kvm-smoke.log || { echo "KVM ile SeaBIOS açılmadı" >&2; exit 1; }
        echo "VMTEST_DIR=/mnt/vm-test" >> "$GITHUB_ENV"
