# kubeadm'in ürettiği ayar ve sertifikalar /var'dadır (/etc/kubernetes buraya bağlantıdır),
# böylece bootc rollback sonrasında da yerindedir.
d /var/lib/kubernetes 0755 root root -
d /var/lib/kubernetes/manifests 0755 root root -
d /var/lib/cni/bin 0755 root root -
d /var/lib/librenfra 0755 root root -
d /run/librenfra 0755 root root -
d /var/lib/kubelet 0755 root root -
d /var/lib/crio 0755 root root -
d /var/lib/cloud 0755 root root -
