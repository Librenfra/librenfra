# Kimliği doğrulanmış kullanıcıların gönderdiği posta, başlıktaki From alan adının
# anahtarıyla imzalanır. Anahtarlar /usr/libexec/librenfra/mail-config tarafından
# /etc/librenfra/secrets/dkim.key'den kopyalanır; DNS kaydı infra/cloudflare'dedir.
selector = "librenfra";
path = "/run/librenfra/rspamd/dkim/$domain.key";
sign_authenticated = true;
sign_local = false;
allow_hdrfrom_mismatch = false;
allow_username_mismatch = true;
use_esld = false;
