protocols = imap lmtp

# Bütün posta kutuları vmail kullanıcısınındır ve veri diskindeki /var/vmail'dedir.
mail_uid = 5000
mail_gid = 5000
first_valid_uid = 5000
last_valid_uid = 5000
mail_location = maildir:~/Maildir

ssl = required
ssl_cert = </etc/librenfra/mail-tls-cert.pem
ssl_key = </etc/librenfra/secrets/mail-tls-key.pem
ssl_min_protocol = TLSv1.2

service lmtp {
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    mode = 0600
    user = postfix
    group = postfix
  }
}
service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
}
