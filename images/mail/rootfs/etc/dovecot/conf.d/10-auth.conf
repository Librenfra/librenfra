# Librenfra: kullanıcılar ve parolalar dizindedir (LDAPS). Sistem kullanıcıları giriş yapamaz.
disable_plaintext_auth = yes
auth_username_format = %Lu
auth_mechanisms = plain login

passdb {
  driver = ldap
  args = /run/librenfra/dovecot/ldap.conf.ext
}
userdb {
  driver = ldap
  args = /run/librenfra/dovecot/ldap.conf.ext
}
